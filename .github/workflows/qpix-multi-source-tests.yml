name: QPIX multi-source regression tests
on:
  push:
    branches:
      - main
      - feature/qpix-multi-source-ingestion-20261104
      - codex/qpix-secondary-assists
    paths:
      - '.github/workflows/qpix-multi-source-tests.yml'
      - 'scripts/c6_sources.py'
      - 'scripts/qpix_verified_sources.py'
      - 'scripts/qpix_source_archive.py'
      - 'scripts/qpix_independent_run.py'
      - 'scripts/qpix_nba_live.py'
      - 'scripts/qpix_bref_ratings.py'
      - 'scripts/qpix_render_verified.py'
      - 'requirements.txt'
      - '.github/workflows/nba-daily.yml'
      - '.github/workflows/qpix-independent.yml'
      - 'tests/test_qpix_nba_live.py'
      - 'tests/test_qpix_bref_ratings.py'
      - 'tests/test_c6_sources.py'
      - 'tests/test_qpix_verified_sources.py'
      - 'tests/test_qpix_source_archive.py'
      - 'scripts/qpix_coverage_audit.py'
      - 'scripts/qpix_collection_checkpoint.py'
      - 'tests/test_qpix_collection_checkpoint.py'
      - 'scripts/qpix_game_crosswalk.py'
      - 'tests/test_qpix_game_crosswalk.py'
      - 'scripts/qpix_secondary_assists.py'
      - 'tests/test_qpix_secondary_assists.py'
      - 'scripts/render_qpix_dashboard.py'
      - 'generate-report.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate multi-source adapters and 334 archived ratings
        run: |
          python -m py_compile scripts/qpix_independent_run.py scripts/c6_sources.py scripts/qpix_verified_sources.py scripts/qpix_source_archive.py scripts/qpix_collection_checkpoint.py scripts/qpix_game_crosswalk.py scripts/qpix_nba_live.py scripts/qpix_bref_ratings.py scripts/qpix_render_verified.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/qpix_coverage_audit.py
          python scripts/qpix_coverage_audit.py 2099-01-01
          python -c "import json; p='data/historical/qpix_audits/2099-01-01.coverage.json'; d=json.load(open(p)); assert d['status']=='source_archive_unavailable'"
