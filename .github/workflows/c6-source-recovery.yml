name: QPIX C6 source recovery probe
on:
  push:
    branches: [dev/c6-source-recovery-20261105]
    paths: ['experiments/c6_recovery/**', '.github/workflows/c6-source-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s experiments/c6_recovery -p 'test_*.py' -v
      - run: python experiments/c6_recovery/c6_probe.py --date 2026-11-04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qpix-c6-source-audit
          path: experiments/c6_recovery/results/c6_probe.json
