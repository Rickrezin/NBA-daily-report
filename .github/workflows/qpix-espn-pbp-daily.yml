name: QPIX ESPN Play-by-Play Daily Raw Archive

on:
  schedule:
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      date_et:
        description: 'Game date YYYY-MM-DD ET (blank means previous ET day)'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/qpix-espn-pbp-daily.yml'

permissions:
  contents: read

concurrency:
  group: qpix-espn-pbp-source
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Determine ET collection window
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          REQUESTED_DATE: ${{ inputs.date_et }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            offset="$(TZ=America/New_York date +%z)"
            if [[ "$offset" == "-0400" && "$SCHEDULE_CRON" != "30 9 * * *" ]] ||
               [[ "$offset" == "-0500" && "$SCHEDULE_CRON" != "30 10 * * *" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -n "$REQUESTED_DATE" ]]; then
            [[ "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
            date_et="$REQUESTED_DATE"
          else
            date_et="$(TZ=America/New_York date -d yesterday +%F)"
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "date_et=$date_et" >> "$GITHUB_OUTPUT"
          echo "Archiving ESPN PBP for ET date $date_et" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Archive ESPN original event feeds for all final games
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/qpix_espn_pbp_collect.py --date-et "${{ steps.gate.outputs.date_et }}"

      - name: Preserve raw sources and manifest even if validation fails
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qpix-espn-pbp-raw-${{ steps.gate.outputs.date_et }}-${{ github.run_id }}
          path: data/historical/qpix_pbp_raw/${{ steps.gate.outputs.date_et }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Explain independence from QPIX scoring
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          echo "This job archives raw ESPN source data only." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not call or modify generate-report.js, update daily rankings, or push commits." >> "$GITHUB_STEP_SUMMARY"
# ET 2026-11-17 collection trigger: QPIX daily independent run, scoring engine unchanged.
