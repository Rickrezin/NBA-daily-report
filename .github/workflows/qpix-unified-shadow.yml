name: QPIX Unified Sources - Daily Shadow Test

on:
  push:
    branches: [main]
    paths:
      - '.github/qpix-shadow-trigger.txt'
      - '.github/workflows/qpix-unified-shadow.yml'
      - 'requirements.txt'
      - 'scripts/qpix_independent_run.py'
      - 'scripts/qpix_nba_live.py'
      - 'scripts/qpix_game_crosswalk.py'
      - 'scripts/qpix_source_archive.py'
      - 'scripts/qpix_render_verified.py'
  schedule:
    # 9:30 AM Eastern, scheduled in both DST and standard time UTC slots.
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      date_et:
        description: 'Optional YYYY-MM-DD ET game date (defaults to previous ET day)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: qpix-unified-shadow
  cancel-in-progress: false

jobs:
  source-shadow:
    name: Independently test verified sources and production scoring
    runs-on: ubuntu-latest
    env:
      ENABLE_NBA_CDN: 'true'
      ENABLE_NBA_V3: 'false'
      QPIX_ENGINE_REVISION: ${{ github.sha }}
    timeout-minutes: 20
    steps:
      - name: Gate to 9:30 AM New York schedule slot
        id: schedule_gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT" == "schedule" ]]; then
            offset="$(TZ=America/New_York date +%z)"
            if [[ "$offset" == "-0400" && "$CRON" != "30 13 * * *" ]] || [[ "$offset" == "-0500" && "$CRON" != "30 14 * * *" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout verified-source collector (read-only)
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install verified NBA live CDN client
        if: steps.schedule_gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Select game date
        if: steps.schedule_gate.outputs.run == 'true'
        id: game_date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date_et }}
        run: |
          if [[ -n "$REQUESTED_DATE" ]]; then
            if [[ ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo 'date_et must be YYYY-MM-DD' >&2
              exit 1
            fi
            RUN_DATE="$REQUESTED_DATE"
          else
            RUN_DATE="$(TZ=America/New_York date -d 'yesterday' +%F)"
          fi
          echo "date_et=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "Testing main collector for ET game date: $RUN_DATE" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect sources, archive inputs, validate and test QPIX locally
        if: steps.schedule_gate.outputs.run == 'true'
        id: shadow_run
        env:
          QPIX_PHASE: regular
        run: python3 scripts/qpix_independent_run.py "${{ steps.game_date.outputs.date_et }}"

      - name: Render the exact verified report for validation
        if: steps.schedule_gate.outputs.run == 'true'
        run: python3 scripts/qpix_render_verified.py "${{ steps.game_date.outputs.date_et }}"

      - name: Summarize per-category and per-game field coverage
        if: ${{ always() && steps.schedule_gate.outputs.run == 'true' && steps.shadow_run.outputs.input_archive != '' }}
        shell: bash
        env:
          INPUT_ARCHIVE: ${{ steps.shadow_run.outputs.input_archive }}
          DATE_ET: ${{ steps.game_date.outputs.date_et }}
        run: python3 scripts/qpix_coverage_audit.py "$DATE_ET" --source "$INPUT_ARCHIVE"

      - name: Upload pre-scoring source archive and audit (including failures)
        if: ${{ always() && steps.schedule_gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: qpix-unified-shadow-${{ steps.game_date.outputs.date_et || 'unknown' }}
          path: |
            data/historical/qpix_input/
            data/historical/qpix_audits/
            data/historical/qpix_raw/
            data/nba_data.json
            data/daily/${{ steps.game_date.outputs.date_et }}.json
            data/daily/${{ steps.game_date.outputs.date_et }}.csv
            docs/reports/${{ steps.game_date.outputs.date_et }}.audit.json
            docs/reports/${{ steps.game_date.outputs.date_et }}.md
            dashboard/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Summarize result
        if: ${{ always() && steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        env:
          OUTCOME: ${{ steps.shadow_run.outcome }}
        run: |
          echo "Shadow test result: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'No commits, pushes, or publication to main are performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"

