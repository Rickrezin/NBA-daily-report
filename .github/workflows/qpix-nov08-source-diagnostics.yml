name: QPIX Nov08 read-only source diagnostics
on:
  push:
    branches: [dev/qpix-engine-export-main-20261108]
    paths: ['.github/workflows/qpix-nov08-source-diagnostics.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dev/qcore-independent-ratings-20261105
          path: prototype
      - name: Fetch ESPN summaries and attempt independently crosswalked NBA V3
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.error, time
          root=pathlib.Path("source-raw");(root/"espn").mkdir(parents=True,exist_ok=True);(root/"nba").mkdir(exist_ok=True)
          date="20261108"
          pairs=[
          ("401909945","0022600196","PHI","CHI"),
          ("401909946","0022600197","LAL","DET"),
          ("401909947","0022600198","UTA","MIN"),
          ("401909948","0022600199","BKN","DAL"),
          ("401909949","0022600200","BOS","MIL"),
          ("401909950","0022600201","NOP","LAC"),
          ("401909951","0022600202","MIA","SAC")]
          headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36","Referer":"https://www.nba.com/","Origin":"https://www.nba.com","Accept":"application/json,text/plain,*/*"}
          attempts=[]
          def collect(url,path,timeout=12):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=timeout) as response: data=response.read()
              path.write_bytes(data)
              attempts.append({"url":url,"ok":True,"bytes":len(data)})
            except Exception as exc:
              attempts.append({"url":url,"ok":False,"error":str(exc)[:250]})
          collect("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates="+date,root/"espn"/"scoreboard.json")
          for eid,gid,away,home in pairs:
            collect(f"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event={eid}",root/"espn"/f"{eid}.json")
            for category in ("boxscoreadvancedv3","boxscoremiscv3"):
              collect(f"https://stats.nba.com/stats/{category}?GameID={gid}&LeagueID=00",root/"nba"/f"{category}-{gid}.json",5)
            collect(f"https://cdn.nba.com/static/json/liveData/boxscore/boxscore_{gid}.json",root/"nba"/f"live-{gid}.json",6)
          (root/"manifest.json").write_text(json.dumps({"date_et":"2026-11-08","pairs":[{"espn":eid,"nba":gid,"away":away,"home":home,"nba_url":f"https://www.nba.com/game/{away.lower()}-vs-{home.lower()}-{gid}"} for eid,gid,away,home in pairs],"attempts":attempts},indent=2))
          print(json.dumps(attempts,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qpix-20261108-espn-raw-plus-nba-attempts
          path: |
            source-raw/
            prototype/experiments/qcore/sources.py
          if-no-files-found: error
          retention-days: 1
