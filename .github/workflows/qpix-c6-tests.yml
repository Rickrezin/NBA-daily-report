name: QPIX C6 field search tests
on:
  push:
    branches:
      - feature/qpix-c6-field-search-20261104
    paths:
      - '.github/workflows/qpix-c6-tests.yml'
      - 'scripts/c6_sources.py'
      - 'tests/test_c6_sources.py'
      - 'scripts/qpix_independent_run.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c6-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate C6 collector module and production syntax
        run: |
          python -m py_compile scripts/c6_sources.py scripts/qpix_independent_run.py
          python -m unittest discover -s tests -p 'test_c6_sources.py' -v
